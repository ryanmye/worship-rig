<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <!-- Menu-bar (Tray) glyph: the app icon's four level bars over a base line, in one colour.
       macOS tints *Template images for light/dark menu bars. Rasterised by build/make-tray-icon.mjs. -->
  <g stroke="#000" stroke-linecap="round" stroke-width="2.4">
    <line x1="5.5" y1="9.6" x2="5.5" y2="14.4"/>
    <line x1="9.17" y1="4.2" x2="9.17" y2="14.4"/>
    <line x1="12.83" y1="6.9" x2="12.83" y2="14.4"/>
    <line x1="16.5" y1="11.2" x2="16.5" y2="14.4"/>
  </g>
  <rect x="3" y="17" width="16" height="2" rx="1" fill="#000"/>
</svg>
