    <clipPath id="body"><path d="M642.22 100C723.36 100 763.93 100 800.51 112.07L807.6 113.81C855.28 131.16 892.84 168.72 910.19 216.4L911.93 223.49C924 260.07 924 300.64 924 381.78L924 642.22C924 723.36 924 763.93 911.93 800.51L910.19 807.6C892.84 855.28 855.28 892.84 807.6 910.19L800.51 911.93C763.93 924 723.36 924 642.22 924L381.78 924C300.64 924 260.07 924 223.49 911.93L216.4 910.19C168.72 892.84 131.16 855.28 113.81 807.6L112.07 800.51C100 763.93 100 723.36 100 642.22L100 381.78C100 300.64 100 260.07 112.07 223.49L113.81 216.4C131.16 168.72 168.72 131.16 216.4 113.81L223.49 112.07C260.07 100 300.64 100 381.78 100Z"/></clipPath>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#191327"/><stop offset="1" stop-color="#100a1c"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfbf7"/><stop offset="0.55" stop-color="#f5ecd8"/><stop offset="1" stop-color="#f4b73f"/>
    </linearGradient>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c35a" stop-opacity="0.95"/><stop offset="0.45" stop-color="#e6ba65" stop-opacity="0.45"/><stop offset="1" stop-color="#e6ba65" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6c35a" stop-opacity="0.55"/><stop offset="0.6" stop-color="#e6ba65" stop-opacity="0.12"/><stop offset="1" stop-color="#e6ba65" stop-opacity="0"/>
