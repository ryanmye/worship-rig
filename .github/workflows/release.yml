name: release

# Builds the 1.x Electron Worship Rig.app for Apple Silicon (arm64) and Intel (x64) as .dmg + .zip.
# - push a tag v1.*          → build, upload the four files to the run, and create a GitHub release with them
# - publish a release v1.* from the web UI → the same, attached to that release
# - Actions → release → Run  → dry_run (default true): build + upload to the run only, never a release
# A release is only created when the ref is a v1.* tag AND it's a tag push / release event (or a manual run on a v1.*
# tag with dry_run off). Dispatching on a branch (e.g. main) can never create a release.
# 1.x only (lane N10, MAC_CHECK "2.0 release checklist" B3): v2.* and later tags are the native app
# (release-native.yml). `tags: ['v1.*']` keeps a 2.x tag push from starting this workflow at all; the `release` event
# and workflow_dispatch can't be filtered by tag, so both jobs also check `refs/tags/v1.` themselves: a 2.x release
# published from the web UI, or a run dispatched on a 2.x tag, builds and publishes no Electron app.
# v11-electron: the app's "update available" check (update-check.js) reads GitHub's /releases/latest and offers
# Worship-Rig-<arch>.dmg (else .zip) from it. So: keep the four asset names stable (package.json mac.artifactName),
# keep releases non-draft / non-prerelease (the API's "latest" skips those), and tag v<package.json version>.
# No latest-mac.yml is needed: nothing uses electron-updater (ad-hoc signed builds can't be auto-installed).

on:
  push:
    tags: ['v1.*']
  # A release published from the GitHub web UI (Releases > Draft a new release > new tag v1.* > Publish) creates the tag
  # there, so no git push is needed: build and attach the files to that release. (From main's 261ea8d; gated to v1.)
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and upload artifacts to the run only (no GitHub release)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.arch }})
    # any branch (dry run), or a v1.* tag; never a v2.*+ tag (the release event always has a tag ref)
    if: ${{ !startsWith(github.ref, 'refs/tags/') || startsWith(github.ref, 'refs/tags/v1.') }}
    runs-on: macos-15
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            cmd: npm run build:mac -- --publish never
          - arch: x64
            cmd: npx electron-builder --mac dir zip dmg --x64 --publish never
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v1.')
        run: |
          v="$(node -p 'require("./package.json").version')"
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $v"
            exit 1
          fi

      - name: Build ${{ matrix.arch }} (dir + zip + dmg, ad-hoc signed)
        run: ${{ matrix.cmd }}

      - name: Check sizes
        run: |
          v="$(node -p 'require("./package.json").version')"
          app_dir="dist/mac"; [ "${{ matrix.arch }}" = arm64 ] && app_dir="dist/mac-arm64"
          app_mb=$(( $(du -sk "$app_dir/Worship Rig.app" | cut -f1) / 1024 ))
          echo "APP_VERSION=$v" >> "$GITHUB_ENV"
          {
            echo "### ${{ matrix.arch }}"
            echo "| file | size |"
            echo "|---|---|"
            echo "| Worship Rig.app | ${app_mb} MB |"
            for f in "dist/Worship-Rig-${{ matrix.arch }}.zip" "dist/Worship-Rig-${{ matrix.arch }}.dmg"; do
              echo "| $(basename "$f") | $(( $(stat -f %z "$f") / 1048576 )) MB |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          # CLAUDE.md size budget: the packaged app stays under 500 MB (build-lint fails above 480 MB)
          if [ "$app_mb" -gt 480 ]; then echo "::error::Worship Rig.app is ${app_mb} MB (> 480 MB)"; exit 1; fi

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: Worship-Rig-${{ matrix.arch }}.zip
          path: dist/Worship-Rig-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: Worship-Rig-${{ matrix.arch }}.dmg
          path: dist/Worship-Rig-${{ matrix.arch }}.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    needs: build
    # v1.* tag push or release event, or a manual run on a v1.* tag with dry_run unticked; never from a branch, never
    # for a v2.*+ tag
    if: >-
      startsWith(github.ref, 'refs/tags/v1.') && (github.event_name == 'push' || github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download the four files
        uses: actions/download-artifact@v4
        with:
          pattern: Worship-Rig-*
          path: assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la assets
          cat > notes.md <<EOF
          Worship Rig ${GITHUB_REF_NAME}

          **Which file?**
          - Apple Silicon Mac (M1 or later): \`Worship-Rig-arm64.dmg\`
          - Intel Mac: \`Worship-Rig-x64.dmg\`
          - The \`.zip\` files hold the same app; use them if a .dmg won't open.

          Starter library: worship-rig-starter-library.json — import via Settings › Library & backups if you want
          the factory set back.

          This build is **ad-hoc signed**, not notarized by Apple — see the README
          ("Running on your Mac → First open on another Mac") for the Gatekeeper steps.
          EOF
          files=(assets/*.dmg assets/*.zip docs/starter/worship-rig-starter-library.json)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # made in the web UI (release event), or a re-run: attach the files and set the standard title and notes
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "Worship Rig $GITHUB_REF_NAME" --notes-file notes.md --draft=false --prerelease=false
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Worship Rig $GITHUB_REF_NAME" \
              --notes-file notes.md
          fi
