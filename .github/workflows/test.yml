name: test

on:
  push:
    branches: [main]
    paths-ignore:
      - '.cloud-outbox/**'
      - 'reviews/**'
      - 'docs/**'
      - '**/*.md'
      - 'COORDINATION.md'
      - 'BACKLOG.md'
      - 'design/**'
      - 'audition/**'
  pull_request:
    paths-ignore:
      - '.cloud-outbox/**'
      - 'reviews/**'
      - 'docs/**'
      - '**/*.md'
      - 'COORDINATION.md'
      - 'BACKLOG.md'
      - 'design/**'
      - 'audition/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg (engine fixtures)
        run: brew install ffmpeg

      - name: Install Playwright browsers
        run: npx playwright install chromium chromium-headless-shell

      - name: Run fast test suite
        run: node test/run-all.mjs --fast

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: |
            test/logs
            test/**/screenshots/**
          if-no-files-found: ignore
