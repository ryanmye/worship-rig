<!doctype html>
<!--
  PLACEHOLDER popover page (menu-bar mode, docs/menubar-mode.md), written by the LOCAL Electron session only so the
  Tray popover has something to load. The CLOUD builds the real app/mini.html + app/mini.css + app/js/views/mini.js
  (C7 "B"): replace this whole file with it, then delete drivePlaceholder() in main.js.
  The server's CSP forbids inline scripts and this session may not add files under app/js, so this page carries no
  script: main.js injects a tiny driver (window.rig.miniSubscribe / miniCommand) only into pages with the
  <meta name="rig-mini-placeholder"> marker below.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="rig-mini-placeholder" content="main.js drivePlaceholder() drives this page">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Worship Rig</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #eef1f5; }
  .card { box-sizing: border-box; height: 100%; padding: 14px; border-radius: 12px; background: rgba(20, 23, 28, 0.97);
    border: 1px solid #2c323c; display: flex; flex-direction: column; gap: 10px; }
  .label { color: #8a93a0; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  #now { font-size: 20px; font-weight: 600; }
  #modes { margin: 0; font: 12px/1.5 ui-monospace, Menlo, monospace; white-space: pre; color: #c9ced6; }
  .row { display: flex; gap: 8px; }
  button { flex: 1; padding: 8px 0; border-radius: 8px; border: 1px solid #3a414c; background: #232830; color: inherit;
    font: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid #4aa8ff; outline-offset: 1px; }
  button.panic { background: #d9363a; border-color: #d9363a; color: #fff; }
  #raw { flex: 1; min-height: 0; overflow: auto; margin: 0; font: 10px/1.3 ui-monospace, Menlo, monospace; color: #8a93a0; }
</style>
</head>
<body>
<main class="card">
  <div class="label">Now playing (placeholder popover)</div>
  <div id="now">Waiting for Worship Rig…</div>
  <pre id="modes"></pre>
  <div class="row">
    <button type="button" data-cmd="prevMode">Prev</button>
    <button type="button" data-cmd="nextMode">Next</button>
    <button type="button" data-cmd="panic" class="panic">Panic</button>
  </div>
  <div class="row"><button type="button" data-cmd="openMain">Open Worship Rig</button></div>
  <pre id="raw"></pre>
</main>
</body>
</html>
