<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Studio mark: one console channel. Warm-grey module face, walnut cheek, a fader cap in its slot and a lit lamp. -->
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4540"/><stop offset="1" stop-color="#2e2a26"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5e3d26"/><stop offset=".5" stop-color="#8a5c3a"/><stop offset="1" stop-color="#6a452c"/></linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1ede6"/><stop offset="1" stop-color="#bdb6ab"/></linearGradient>
    <radialGradient id="lamp" cx=".42" cy=".38" r=".7"><stop offset="0" stop-color="#fff4d8"/><stop offset=".45" stop-color="#f7c367"/><stop offset="1" stop-color="#c9822f"/></radialGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#face)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <rect x="49" y="8" width="5" height="48" rx="2.5" fill="url(#wood)"/>
  <rect x="21" y="12" width="6" height="42" rx="3" fill="#15120f"/>
  <rect x="21" y="34" width="6" height="20" rx="3" fill="#f2955a"/>
  <rect x="13" y="26" width="22" height="11" rx="3" fill="url(#cap)" stroke="#15120f" stroke-width="1.5"/>
  <rect x="13" y="30.8" width="22" height="1.6" fill="#6b635a"/>
  <circle cx="40" cy="15" r="7" fill="#f7c367" opacity=".22"/>
  <circle cx="40" cy="15" r="4.2" fill="url(#lamp)"/>
</svg>
