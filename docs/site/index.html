<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worship Rig</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0e1014;
    color: #e8e6e1;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 24px;
    box-sizing: border-box;
  }
  main {
    max-width: 520px;
    text-align: center;
  }
  h1 {
    font-size: 2rem;
    margin: 0 0 12px;
    color: #f4b860;
    letter-spacing: 0.02em;
  }
  p.tagline {
    font-size: 1.05rem;
    line-height: 1.5;
    color: #c9c6bf;
    margin: 0 0 28px;
  }
  nav {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-bottom: 28px;
  }
  nav a {
    display: inline-block;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid #f4b860;
    color: #f4b860;
    text-decoration: none;
    font-size: 0.95rem;
    transition: background 0.15s ease, color 0.15s ease;
  }
  nav a:hover {
    background: #f4b860;
    color: #0e1014;
  }
  p.soon {
    font-size: 0.85rem;
    color: #8b8880;
    margin: 0;
  }
</style>
</head>
<body>
<main>
  <h1>Worship Rig</h1>
  <p class="tagline">Live MIDI keys, pads and key drones for worship, ambient and lofi. Electron app + Chrome fallback.</p>
  <nav>
    <a href="https://github.com/ryanmye/worship-rig/releases">Releases</a>
    <a href="https://github.com/ryanmye/worship-rig#readme">README</a>
    <a href="https://github.com/ryanmye/worship-rig">Repository</a>
  </nav>
  <p class="soon">Coming soon: screenshots, install notes, starter backup.</p>
</main>
</body>
</html>
