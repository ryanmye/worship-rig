<!DOCTYPE html>
<!-- U2 harness: the v6 keyboard with range bars (app/js/views/v6/keyboard.js) on its own, 'range' size (Edit › Range,
     88 keys A0–C8, one bar) and optionally 'perform'. Served by test/phase2/ui-v6/run.mjs at /u2-keyboard-harness.html
     on the app's origin (a page.route), so the module and stylesheets load from app/ as in the app. A fake store stands
     in for the shell: onRange writes into it and re-renders, like store.set → render. Query: ?size=range|perform,
     ?coarse=1|0 (default: the real '(pointer: coarse)'). The theme is the app's (themes/boot.js, localStorage). -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./themes/boot.js"></script>
  <title>U2 keyboard harness</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./styles-v6.css">
  <style>
    body { margin: 0; padding: 40px 30px; background: var(--bg, #160d12); color: var(--text, #eee); }
    .v6.harness { height: auto; display: block; padding: 0; max-width: 620px; }
    .v6.harness .box { padding: 10px 12px; border-radius: 12px; }
    .v6.harness .box.perform { height: 96px; display: flex; box-sizing: border-box; max-width: 720px; }
    #log { margin-top: 16px; font: 12px monospace; color: #aaa; }
  </style>
  <script src="./themes/boot.js"></script>
</head>
<body>
  <div class="v6 harness" id="root"><div class="panel box" id="box"></div><div id="log"></div></div>
  <script type="module">
    import { rangeKeyboard } from './js/views/v6/keyboard.js';
    const q = new URLSearchParams(location.search);
    const size = q.get('size') === 'perform' ? 'perform' : 'range';
    const COL = ['#f28a5b', '#4cc796', '#78c8f0', '#a98af0'];
    const NAMES = ['Grand Piano', 'Warm Pad', 'Sub Bass', 'Strings'];
    const state = {
      locked: false,
      slots: size === 'range' ? [{ lo: 0, hi: 127 }] : [{ lo: 0, hi: 127 }, { lo: 48, hi: 84 }, { lo: 0, hi: 59 }],
    };
    const writes = [];
    const box = document.getElementById('box');
    if (size === 'perform') box.classList.add('perform');
    const coarse = q.get('coarse') === '1' ? true : q.get('coarse') === '0' ? false : undefined;
    const kb = rangeKeyboard({
      size, coarse,
      onRange: (i, field, note) => {
        if (state.locked) return false;
        writes.push([i, field, note]);
        state.slots[i][field === 'lowNote' ? 'lo' : 'hi'] = note;
        queueMicrotask(render); // like the store's batched notify
        return true;
      },
      onPick: (i) => { window.__picked = i; },
    });
    box.append(kb.el);
    function render() {
      kb.render({
        locked: state.locked,
        // the 'range' size takes one bar; extra bars are ignored (the test checks that)
        bars: state.slots.map((s, i) => ({ i, name: NAMES[i], color: COL[i], lo: s.lo, hi: s.hi }))
          .concat(size === 'range' ? [{ i: 1, name: 'Ignored', color: '#fff', lo: 40, hi: 50 }] : []),
      });
      document.getElementById('log').textContent = JSON.stringify(state.slots);
    }
    render();
    window.__h = {
      kb, state, writes, render,
      set(i, lo, hi) { state.slots[i] = { lo, hi }; render(); },
      lock(on) { state.locked = !!on; render(); },
    };
    window.__ready = true;
  </script>
</body>
</html>
