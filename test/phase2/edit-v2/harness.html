<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edit-v2 harness</title>
<link rel="icon" href="data:,">
<!-- served with the repo root as appDir: /app/... is the real app. Same stylesheets as app/index.html + the
     H-v2 Edit fragment (views/edit/CONTRACT.md §8). -->
<link rel="stylesheet" href="/app/styles.css">
<link rel="stylesheet" href="/app/styles-edit.css">
<link rel="stylesheet" href="/app/js/views/edit/styles-edit-v2.css">
<link rel="stylesheet" href="/app/js/views/components/eq-keyboard.css">
<style>
  html, body { height: 100%; margin: 0; background: #0b0d10; }
  #views { height: 100vh; }
  #view-edit { height: 100%; }
</style>
</head>
<body>
<main id="views" class="views">
  <div id="view-edit" class="view view-edit"></div>
</main>
<div id="view-settings" class="settings-modal" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script type="module">
  // Bootstrap (store → engine → midi/recorder → controller) like test/phase2/ui-edit/fixture.html, then either ONE
  // panel (?panel=<id>&opts=<json>, shell.mountSinglePanel) or the whole view (?full=1, shell.mountEdit).
  // ?key=<localStorage key> isolates the library; ?song=<factory id|song name> selects a song before mounting.
  const q = new URLSearchParams(location.search);
  if (q.get('components') === 'fallback') globalThis.__RIG_FORCE_FALLBACK_COMPONENTS = true;
  const [{ createStore }, { FACTORY_SONGS }, { AudioEngine }, { MidiInput }, { Recorder }, { createController, engineLatency }] = await Promise.all([
    import('/app/js/store.js'),
    import('/app/js/presets.js'),
    import('/app/js/engine/index.js'),
    import('/app/js/midi.js'),
    import('/app/js/recorder.js'),
    import('/app/js/controller.js'),
  ]);
  const toasts = [];
  // same call shape as main.js toast(msg, kind, {ms, action:{label, run}})
  function toast(msg, kind = 'info', opts = {}) {
    toasts.push({ msg, kind, action: opts && opts.action ? opts.action.label : null });
    const el = document.createElement('div');
    el.className = `toast ${kind}`;
    el.textContent = msg;
    if (opts && opts.action) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn toast-action';
      b.textContent = opts.action.label || 'OK';
      b.addEventListener('click', () => {
        el.remove();
        opts.action.run?.();
      });
      el.append(b);
    }
    document.getElementById('toasts').append(el);
    setTimeout(() => el.remove(), (opts && opts.ms) || 3000);
  }
  const store = createStore({ key: q.get('key') || 'rig.v1' });
  store.seedFactory(FACTORY_SONGS);
  const want = q.get('song');
  if (want) {
    const st = store.get();
    const id = st.songOrder.find((x) => st.songs[x].factoryId === want || st.songs[x].name === want || x === want);
    if (id) store.selectSongId(id);
  }
  const engine = new AudioEngine({ latency: engineLatency(store.get().settings) });
  const midi = new MidiInput();
  const recorder = new Recorder({ engine });
  const controller = createController({ store, engine, midi, recorder });
  // idle-cpu-ui: silent meters sleep until wakeMeters(), which main.js calls on controller activity; the harness has
  // no main.js, so wire the same two hooks here (themes-final: the polish-1 slot level-meter test timed out without)
  const { wakeMeters } = await import('/app/js/views/components/meterClock.js');
  if (typeof controller.onActivity === 'function') controller.onActivity(() => wakeMeters());
  controller.addEventListener('notes', () => wakeMeters());
  let baseline = null; // what main.js will pass as getBaseline (perform.js savedSnapshot); tests can set it
  const ctx = {
    store, controller, engine, midi, recorder, toast,
    openSettings: () => {}, closeSettings: () => {}, setView: () => true,
    getBaseline: () => baseline,
  };
  const shell = await import('/app/js/views/edit/shell.js');
  // lib + the component set on the handle, so tests never import() inside page.evaluate (flaky under load)
  const lib = await import('/app/js/views/edit/lib.js');
  const C = await import('/app/js/views/_fallback-components.js').then((m) => m.loadComponents());
  const ready = controller.start();
  const host = document.getElementById('view-edit');
  const panel = q.get('panel');
  const opts = JSON.parse(q.get('opts') || '{}');
  const view = q.get('full') ? shell.mountEdit(host, ctx) : shell.mountSinglePanel(host, ctx, panel, opts);
  globalThis.__rig = {
    store, engine, controller, midi, recorder, ctx, toasts, shell, lib, C, view, ready,
    setBaseline: (s) => { baseline = s; },
    /** the mounted panel's ctx (single-panel mode) */
    get panelCtx() { return view.ctx || null; },
  };
  globalThis.__ev2 = { ready: true, panel, full: !!q.get('full'), components: C.__source };
</script>
</body>
</html>
